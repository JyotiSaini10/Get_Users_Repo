<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Users Repo.</title>
    <style>
        *{
            box-sizing: border-box;
        }

        html,body{
            height: 100%;
            width: 100%;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
    <body class="min-h-screen bg-slate-950 text-white">
  <main class="min-h-screen px-6 py-10">
    <section class="mx-auto max-w-6xl">

      <!-- Header -->
      <div class="mb-10 text-center">
        <span class="inline-flex rounded-full border border-cyan-400/30 bg-cyan-400/10 px-4 py-1 text-sm font-medium text-cyan-300">
          GitHub Profile Finder
        </span>

        <h1 class="mt-6 text-4xl font-bold tracking-tight sm:text-6xl">
          Discover GitHub Users
          <span class="block bg-gradient-to-r from-cyan-300 to-blue-500 bg-clip-text text-transparent">
            Instantly
          </span>
        </h1>

        <p class="mx-auto mt-5 max-w-2xl text-slate-400">
          Search any GitHub username and display their profile details, repositories,
          followers, bio, and activity in a clean professional dashboard.
        </p>
      </div>

      <!-- Search Box -->
      <div class="mx-auto mb-12 max-w-3xl rounded-2xl border border-white/10 bg-white/5 p-4 shadow-2xl backdrop-blur">
        <div class="flex flex-col gap-4 sm:flex-row">
          <input
            type="text"
            placeholder="Enter GitHub username..."
            class="usernameinp w-full rounded-xl border border-white/10 bg-slate-900 px-5 py-4 text-white outline-none transition placeholder:text-slate-500 focus:border-cyan-400 focus:ring-4 focus:ring-cyan-400/10"
          />

          <button
            class=" search rounded-xl bg-cyan-400 px-8 py-4 font-semibold text-slate-950 transition hover:bg-cyan-300 active:scale-95"
          >
            Search
          </button>
        </div>
      </div>

      <!-- Profile Card -->
      <section class="grid gap-8 lg:grid-cols-[360px_1fr]">

        <!-- User Info -->
        <aside class=" card rounded-3xl border border-white/10 bg-white/5 p-8 shadow-xl backdrop-blur">
            
        </aside>

        <!-- Stats + Details -->
        <div class="  space-y-8">

          <!-- Stats -->
         <div class="repo grid gap-5 sm:grid-cols-3">

         </div>
          </div>

          <!-- Details -->
          <div class="rounded-3xl border border-white/10 bg-white/5 p-8 shadow-xl backdrop-blur">
            <h3 class="mb-6 text-xl font-bold">Profile Details</h3>

            <div class=" prof grid gap-5 sm:grid-cols-2">
              
            </div>
          </div>

          <!-- Repositories -->
          <div class=" topRepos rounded-3xl border border-white/10 bg-white/5 p-8 shadow-xl backdrop-blur">
            
            </div>
          </div>

        </div>
      </section>
    </section>
  </main>

    <script src="script.js"></script>
</body>
</html>
